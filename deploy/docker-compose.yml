services:
  postgres:
    image: postgres:16-alpine
    # pg/redis 不参与 --scale，固定容器名与端口不会冲突
    container_name: wb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whiteboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wb-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 默认 `up` 路径的迁移：跑完即退出，api 等它成功后再启动。
  # 迁移本身幂等（schema_migrations 记录 checksum），重复执行只输出 up to date。
  migrate-auto:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/whiteboard
      REDIS_URL: redis://redis:6379
      # 仅本地演示用；生产必须替换这两个密钥
      SESSION_SECRET: dev-only-change-me-0123456789abcdef
      GUEST_COOKIE_SECRET: dev-only-guest-cookie-secret-32chars-min
    command: ["node", "apps/server/dist/db/migrate.js"]

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    # 不写 container_name：允许 `up -d --scale api=2`（需叠加 scale override）
    # 默认只绑 8080，重建后入口永远是 8080:8080；
    # 双实例验证用 deploy/docker-compose.scale.yml 把端口换成区间
    ports:
      - "8080:8080"
    environment:
      <<: *api-env
      PORT: "8080"
      # 前端构建产物由 API 同源托管；图片落盘到共享卷，多实例读到同一份
      STORAGE_ROOT: /app/storage
      # INSTANCE_ID 不写死：默认取容器主机名，--scale 后两个实例各自可区分
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-auto:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 手动迁移（能力保留）：默认不启动，需要单独升级/排障时执行
  #   docker compose --profile init run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    profiles: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
    command: ["node", "apps/server/dist/db/migrate.js"]

volumes:
  pgdata:
  redisdata:
  storage:
