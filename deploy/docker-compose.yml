services:
  postgres:
    image: postgres:16-alpine
    # pg/redis 不参与 --scale，固定容器名与端口不会冲突
    container_name: wb-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: whiteboard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d whiteboard"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: wb-redis
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 默认 `up` 路径的迁移：跑完即退出，api 等它成功后再启动。
  # 迁移本身幂等（schema_migrations 记录 checksum），重复执行只输出 up to date。
  migrate-auto:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment: &api-env
      NODE_ENV: production
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/whiteboard
      REDIS_URL: redis://redis:6379
      # 仅本地演示用；生产必须替换这两个密钥
      SESSION_SECRET: dev-only-change-me-0123456789abcdef
      GUEST_COOKIE_SECRET: dev-only-guest-cookie-secret-32chars-min
    command: ["node", "apps/server/dist/db/migrate.js"]

  api:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    # 不写 container_name：允许 `up -d --scale api=2`（需叠加 scale override）
    # 默认只绑 8080，重建后入口永远是 8080:8080；
    # 双实例验证用 deploy/docker-compose.scale.yml 把端口换成区间
    ports:
      - "8080:8080"
    environment:
      <<: *api-env
      PORT: "8080"
      # 前端构建产物由 API 同源托管；图片落盘到共享卷，多实例读到同一份
      STORAGE_ROOT: /app/storage
      # INSTANCE_ID 不写死：默认取容器主机名，--scale 后两个实例各自可区分
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate-auto:
        condition: service_completed_successfully
    volumes:
      - storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 手动迁移（能力保留）：默认不启动，需要单独升级/排障时执行
  #   docker compose --profile init run --rm migrate
  migrate:
    build:
      context: ..
      dockerfile: apps/server/Dockerfile
    profiles: ["init"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *api-env
    command: ["node", "apps/server/dist/db/migrate.js"]

  # S3 兼容存储的本地联调（默认不启动）：
  #   docker compose --profile s3 up -d s3
  # 然后在 .env 里设 STORAGE_DRIVER=s3、S3_ENDPOINT=http://127.0.0.1:9000，
  # 凭据 minioadmin / minioadmin，桶 whiteboard 在启动时预建，path-style 与既有配置一致。
  #
  # 为什么不是 MinIO：MinIO 社区版已停止分发（官方 dl.min.io 对二进制返回 410，
  # Docker Hub 的 minio/minio 也已无法完整拉取），详见开发文档 §13.4。
  # 这里用 rclone 自带的 S3 服务端，协议、鉴权（SigV4）、path-style 行为一致，换云只改配置。
  # 若 Docker Hub 被墙，可先从镜像站拉取后本地改名：docker tag <mirror>/rclone/rclone:latest rclone/rclone:latest
  s3:
    image: rclone/rclone:latest
    container_name: wb-s3
    profiles: ["s3"]
    # rclone 镜像的 entrypoint 是 rclone 本身，这里用 shell 预建桶目录再启动服务
    entrypoint:
      - /bin/sh
      - -c
      - mkdir -p /data/whiteboard && exec rclone serve s3 --addr :9000 --auth-key minioadmin,minioadmin /data
    ports:
      - "9000:9000"   # S3 API
    volumes:
      - s3data:/data

volumes:
  pgdata:
  redisdata:
  storage:
  s3data:
